# Perbarui data PIHPS, latih ulang model, dan deploy dashboard ke GitHub Pages.
# - Dipicu tombol "Perbarui data" di dashboard (workflow_dispatch via GitHub API)
#   atau manual dari tab Actions.
# - Push ke folder docs/ hanya men-deploy ulang dashboard (tanpa menarik data).
# Nama langkah dibaca dashboard untuk menampilkan progres — jika diubah, sesuaikan juga docs/index.html.
name: Perbarui data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: perbarui-data
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - name: Siapkan repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        if: github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Tarik data terbaru PIHPS
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_pihps.py --incremental

      - name: Olah data & EDA (notebook 01)
        if: github.event_name == 'workflow_dispatch'
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 01_pengambilan_data_dan_eda.ipynb

      - name: Latih model & hitung prediksi (notebook 02)
        if: github.event_name == 'workflow_dispatch'
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 02_analisis_prediksi_dan_peringatan_dini.ipynb

      - name: Simpan hasil ke repositori
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Notebook tidak di-commit agar narasi laporan tetap sesuai versi yang dianalisis
          git add data/raw/pihps_jabar_harian.csv.gz data/processed/ docs/data/dashboard.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Perbarui data PIHPS & prediksi ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Terbitkan dashboard
        id: deploy
        uses: actions/deploy-pages@v4
